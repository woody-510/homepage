---
layout: default
---

<article>
    <h1>{{ page.title }}</h1>
    
    <div class="work-content">
        <!-- Markdownの本文がここに入ります -->
        {{ content }}
    </div>

    <!-- YouTube埋め込みがある場合 -->
    {% if page.youtube_id %}
    <div class="video-container">
        <!-- 【YouTubeのIDから自動的に埋め込みフレームを作成します】 -->
        <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
    {% endif %}

    <!-- ダウンロードリンクがある場合 -->
    {% if page.download_url %}
    <div class="download-section">
        <h3>この作品をダウンロード</h3>
        <p>以下のボタンからGoogle Drive等経由でファイルをダウンロードできます。</p>
        <br>
        <a href="{{ page.download_url }}" class="btn download-btn" target="_blank" rel="noopener noreferrer">Download File</a>
    </div>
    {% endif %}

    <div style="margin-top: 3rem;">
        <a href="{{ '/works.html' | relative_url }}">← Works一覧に戻る</a>
    </div>
</article>
