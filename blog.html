---
layout: default
title: Blog
---

<h1>Blog</h1>
<p>サイト制作の進捗や個人的なニュースなどいろいろ</p>

<ul class="item-list">
    <!-- _posts フォルダ内の記事を自動で読み込みます -->
    {% for post in site.posts %}
    <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <p>{{ post.date | date: "%Y.%m.%d" }} - {{ post.excerpt | strip_html | truncatewords: 20 }}</p>
    </li>
    {% endfor %}
</ul>

<!-- 【ブログ記事の追加方法】 -->
<!--
新しい記事を追加するには、 `_posts` フォルダの中に
`YYYY-MM-DD-好きな英数字.md` （例: 2026-05-01-hello.md）
という名前でファイルを作成してください。ファイル名の日付が投稿日として扱われます。
-->
