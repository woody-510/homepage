---
layout: default
title: Works
---

<h1>Works</h1>
<p>これまでに制作した作品の一覧です。</p>

<ul class="item-list">
    <!-- _works フォルダ内のマークダウンファイルを自動で読み込みます -->
    {% for work in site.works %}
    <li>
        <a href="{{ work.url | relative_url }}">{{ work.title }}</a>
        <p>{{ work.description }}</p>
    </li>
    {% endfor %}
</ul>

<!-- 【作品の追加方法について】 -->
<!--
新しい作品を追加するには、 `_works` フォルダの中に新しいマークダウンファイル（例: new-project.md）を作成し、
すでに用意されている `template.md` の内容をコピーして編集してください。
ファイルを作成してアップロードするだけで、自動的にこのページの一覧に追加されます。
-->
