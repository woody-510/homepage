    <img src="assets/image/atami.jpg" alt="Slide 1" class="slide active">
    <img src="assets/image/doushimiti.jpg" alt="Slide 2" class="slide">
    <img src="assets/image/enoshima1.jpg" alt="Slide 3" class="slide">
    <img src="assets/image/otaru.jpg" alt="Slide 4" class="slide">
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const slides = document.querySelectorAll('.hero-slideshow .slide');
    let currentSlide = 0;
    
    // 画像が2枚以上ある場合のみタイマーを作動させる
    if(slides.length > 1) {
        setInterval(() => {
            // 現在の画像を透明にする
            slides[currentSlide].classList.remove('active');
            // 次の画像の番号を計算（最後まで行ったら0に戻る）
            currentSlide = (currentSlide + 1) % slides.length;
            // 次の画像を表示する
            slides[currentSlide].classList.add('active');
        }, 4000); // 【編集】4000 = 4秒ごとに切り替わります。お好みで変更してください。
    }
});
</script>
